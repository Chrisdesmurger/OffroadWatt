<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bolt-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5b840"/>
      <stop offset="100%" stop-color="#e08820"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2220"/>
      <stop offset="100%" stop-color="#101414"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg-grad)"/>

  <!-- Subtle border ring -->
  <rect x="8" y="8" width="496" height="496" rx="88" ry="88"
        fill="none" stroke="#f0a030" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Lightning bolt -->
  <path d="
    M 280 56
    L 168 248
    L 240 248
    L 200 456
    L 344 232
    L 268 232
    Z
  " fill="url(#bolt-grad)"/>

  <!-- Subtle glow behind bolt -->
  <path d="
    M 280 56
    L 168 248
    L 240 248
    L 200 456
    L 344 232
    L 268 232
    Z
  " fill="#f0a030" opacity="0.12" filter="url(#glow)"/>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
