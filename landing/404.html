<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#090b0a">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090b0a;--bg2:#0f1310;--bg3:#141a16;--border:#1e2820;--border2:#2a3830;
  --amber:#f0a030;--amber2:#e08820;--amber3:rgba(240,160,48,.12);--teal:#2dd4bf;
  --t1:#ddeedd;--t2:#7a9985;--t3:#4a6455;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;--r:8px;--r2:14px;
}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(240,160,48,.13) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 90%,rgba(45,212,191,.07) 0%,transparent 50%)}
nav{position:relative;z-index:1;display:flex;align-items:center;padding:0 24px;height:64px;border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--amber);text-decoration:none}
.logo em{color:var(--t3);font-style:normal}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px}
.code{font-family:var(--mono);font-size:clamp(72px,18vw,140px);font-weight:700;line-height:1;color:var(--amber);letter-spacing:-2px}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--teal);margin:18px 0 10px}
h1{font-size:clamp(24px,5vw,36px);font-weight:700;letter-spacing:-.5px;margin-bottom:14px}
p{color:var(--t2);max-width:460px;margin:0 auto 32px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:var(--r);font-weight:600;font-size:15px;text-decoration:none;transition:all .2s;font-family:var(--sans)}
.btn-primary{background:var(--amber);color:#090b0a}
.btn-primary:hover{background:var(--amber2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(240,160,48,.25)}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--t1)}
.btn-ghost:hover{border-color:var(--amber)}
.links{margin-top:34px;font-size:13px;font-family:var(--mono);color:var(--t3);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.links a{color:var(--t2);text-decoration:none}
.links a:hover{color:var(--amber)}
.links span{color:var(--border2)}
</style>
</head>
<body>
<div class="bg"></div>
<nav><a href="/" class="logo">Offroad<em>Watt</em></a></nav>
<main>
  <div class="code">404</div>
  <div class="eyebrow">Off the grid</div>
  <h1>This page ran out of charge</h1>
  <p>The page you're looking for doesn't exist or has moved. Let's get you back to something useful.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">Back to home</a>
    <a href="https://app.offroadwatt.com/" class="btn btn-ghost">Open the calculator</a>
  </div>
  <div class="links">
    <a href="/blog">Blog</a><span>·</span>
    <a href="/blog/fr">Blog FR</a><span>·</span>
    <a href="/blog/es">Blog ES</a><span>·</span>
    <a href="/about">About</a>
  </div>
</main>
</body>
</html>
