<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OffroadWatt — Calculateur d'autonomie électrique</title>
<meta name="description" content="Calculez l'autonomie électrique de votre camping-car, caravane ou van. Batterie, panneaux solaires, appareils — tout en un.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e0d;--s1:#141817;--s2:#1c201e;--s3:#232926;
  --b1:#2a3330;--b2:#3d4a46;
  --t1:#e6ede8;--t2:#8da89a;--t3:#5a7068;
  --am:#f0a030;--am2:#c47a18;--am3:#7a4c0e;
  --te:#2dd4bf;--te2:#0f9985;--te3:#054840;
  --so:#fbbf24;--so2:#d97706;--so3:#7c4500;
  --rd:#f87171;--gr:#4ade80;--pu:#a78bfa;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --r:6px;--r2:10px;
}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:14px}
.hdr{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--b1);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--am)}.logo em{color:var(--t3);font-style:normal}
.sub{font-size:10px;color:var(--t3);margin-top:1px}
.vtypes{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.vt{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 9px;cursor:pointer;text-align:center;transition:all .12s;min-width:68px}
.vt.on{border-color:var(--am);background:rgba(240,160,48,.07)}
.vt i{display:block;font-size:17px;color:var(--t3);margin-bottom:2px}.vt.on i{color:var(--am)}
.vt span{font-size:9px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.5px}.vt.on span{color:var(--am)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--b1);margin-bottom:16px;overflow-x:auto}
.tab{padding:7px 14px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tab.on{color:var(--am);border-bottom-color:var(--am)}.tab:hover:not(.on){color:var(--t2)}
.tab i{font-size:12px}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:660px){.col2{grid-template-columns:1fr}}
.col3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:1000px){.col3{grid-template-columns:1fr 1fr}}
@media(max-width:660px){.col3{grid-template-columns:1fr}}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:13px}
.ct{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.ct i{font-size:13px;color:var(--am)}.ct.sol i{color:var(--so)}.ct.te i{color:var(--te)}
.catf{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cf{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:3px 9px;font-size:10px;font-family:var(--mono);color:var(--t3);cursor:pointer;transition:all .1s;text-transform:uppercase;letter-spacing:.4px}
.cf.on{border-color:var(--am);color:var(--am);background:rgba(240,160,48,.07)}
.cf:hover:not(.on){border-color:var(--b2);color:var(--t2)}
.applist{display:flex;flex-direction:column;gap:4px}
.arow{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:7px 10px;display:grid;grid-template-columns:28px 16px 1fr 70px 90px 52px 24px;align-items:center;gap:7px;transition:border-color .12s}
.arow:hover{border-color:var(--b2)}.arow.off{opacity:.35}
.arow .ai{font-size:13px;color:var(--t3)}
.arow .an{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .wf,.arow .hf{display:flex;align-items:center;gap:3px}
.arow .wf input,.arow .hf input{width:46px;background:var(--s3);border:1px solid var(--b1);border-radius:3px;color:var(--t1);font-family:var(--mono);font-size:11px;padding:2px 5px;text-align:center}
.arow .wf span,.arow .hf span{font-size:10px;color:var(--t3)}
.arow .wh{font-family:var(--mono);font-size:11px;color:var(--am);text-align:right;min-width:46px}
.arow.off .wh{color:var(--t3)}
.tog{width:26px;height:15px;border-radius:7px;background:var(--b1);cursor:pointer;border:none;position:relative;transition:background .12s;flex-shrink:0}
.tog.on{background:var(--te2)}.tog::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--t3);transition:all .12s}.tog.on::after{left:13px;background:#fff}
.delbtn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:2px;line-height:1;display:flex;align-items:center;justify-content:center}.delbtn:hover{color:var(--rd)}
.addbtn{background:transparent;border:1px dashed var(--b2);border-radius:var(--r);padding:7px;color:var(--t3);font-size:12px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .12s;margin-top:6px;font-family:var(--sans)}
.addbtn:hover{border-color:var(--am2);color:var(--am)}
.cons-footer{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cf-num{font-family:var(--mono);font-size:15px;color:var(--am);font-weight:700}
.batgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:4px}
.bopt{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 4px;text-align:center;cursor:pointer;transition:all .12s}
.bopt:hover{border-color:var(--am2)}.bopt.on{border-color:var(--am);background:rgba(240,160,48,.07)}
.bopt .bah{font-family:var(--mono);font-size:12px;font-weight:700}.bopt.on .bah{color:var(--am)}
.bopt .btype{font-size:9px;color:var(--t3)}.bopt.on .btype{color:var(--am2)}
.dod-row,.nb-row{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.dod-row label,.nb-row label{font-size:11px;color:var(--t2);flex-shrink:0;min-width:110px}
.dod-row input[type=range]{flex:1;accent-color:var(--am);min-width:80px}
.dod-row .dv{font-family:var(--mono);font-size:12px;color:var(--am);min-width:28px}
.nb-btns{display:flex;gap:3px;flex-wrap:wrap}
.nbb{width:28px;height:24px;background:var(--s2);border:1px solid var(--b1);border-radius:3px;font-family:var(--mono);font-size:11px;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.nbb:hover{border-color:var(--am2);color:var(--am)}.nbb.on{border-color:var(--am);color:var(--am);background:rgba(240,160,48,.07);font-weight:700}
.bat-summary{background:var(--s3);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px;margin-top:8px;font-size:11px}
.bsrow{display:flex;justify-content:space-between;padding:2px 0;flex-wrap:wrap;gap:4px}
.bsn{color:var(--t2)}.bsv{font-family:var(--mono)}.bsv.hi{color:var(--te)}.bsv.am{color:var(--am)}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px;margin-bottom:8px}
.spo{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:5px 3px;text-align:center;cursor:pointer;transition:all .12s}
.spo:hover{border-color:var(--so2)}.spo.on{border-color:var(--so);background:rgba(251,191,36,.07)}
.spo .spw{font-family:var(--mono);font-size:12px;font-weight:700}.spo.on .spw{color:var(--so)}
.spo .spl{font-size:9px;color:var(--t3)}.spo.on .spl{color:var(--so2)}
.sol-config{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.scf{margin-bottom:6px}.scf label{font-size:11px;color:var(--t2);display:block;margin-bottom:3px}
.scf input,.scf select{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-family:var(--mono);font-size:11px;padding:5px 7px}
.scf select:focus,.scf input:focus{outline:none;border-color:var(--so2)}
.sol-summary{background:rgba(251,191,36,.06);border:1px solid var(--so3);border-radius:var(--r);padding:8px 10px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.ss-item .ssn{font-family:var(--mono);font-size:15px;color:var(--so);font-weight:700}
.ss-item .ssl{font-size:10px;color:var(--t3)}
.energy-panel{display:flex;flex-direction:column;gap:10px}
.ef-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:2px}
.ef{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px;text-align:center}
.ef.sol{border-color:var(--so3)}.ef.bat{border-color:var(--te3)}.ef.net.ok{border-color:var(--te3)}.ef.net.bad{border-color:#7f2929}
.ef .en{font-family:var(--mono);font-size:17px;font-weight:700}
.ef.sol .en{color:var(--so)}.ef.bat .en{color:var(--te)}.ef.net.ok .en{color:var(--gr)}.ef.net.bad .en{color:var(--rd)}
.ef .el{font-size:10px;color:var(--t3);margin-top:1px}
.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab-item .abn{font-size:10px;color:var(--t3);margin-bottom:2px}
.ab-item .abv{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
.ab-item .abu{font-size:10px;color:var(--t3);margin-top:1px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;border-radius:3px;font-family:var(--mono);margin-top:4px}
.tok{background:rgba(45,212,191,.1);color:var(--te);border:1px solid var(--te3)}
.twarn{background:rgba(248,113,113,.1);color:var(--rd);border:1px solid #7f2929}
.tsol{background:rgba(251,191,36,.1);color:var(--so);border:1px solid var(--so3)}
.tinf{background:rgba(167,139,250,.1);color:var(--pu);border:1px solid #4c3680}
.bkdown{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px}
.bkrow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--b1);font-size:11px}
.bkrow:last-child{border:none;padding-top:5px}
.bkn{color:var(--t2)}.bkv{font-family:var(--mono)}
.rec-list{display:flex;flex-direction:column;gap:4px}
.ritem{display:flex;justify-content:space-between;align-items:center;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 10px;flex-wrap:wrap;gap:4px}
.ritem.best{border-color:var(--te2)}
.ri-c{font-family:var(--mono);font-size:13px;font-weight:700}.ri-s{font-size:10px;color:var(--t3)}
.ri-d{font-family:var(--mono);font-size:12px;color:var(--te);text-align:right}.ri-n{font-size:9px;color:var(--t3)}
.btag{font-size:8px;background:rgba(45,212,191,.12);color:var(--te);border:1px solid var(--te3);padding:1px 4px;border-radius:2px;font-family:var(--mono);margin-left:4px}
.ai-row{display:flex;gap:6px;margin-bottom:6px}
.ai-in{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-size:13px;padding:8px 10px}
.ai-in:focus{outline:none;border-color:var(--am2)}
.aibtn{background:var(--am3);border:1px solid var(--am2);color:var(--am);border-radius:var(--r);padding:7px 12px;font-family:var(--mono);font-size:10px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.aibtn:hover:not(:disabled){background:var(--am2);color:#fff}.aibtn:disabled{opacity:.5;cursor:not-allowed}
.ai-item{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:9px 11px;margin-bottom:5px}
.ain{font-size:12px;font-weight:500}
.aimeta{display:flex;gap:10px;font-size:10px;color:var(--t2);flex-wrap:wrap;margin-top:3px}
.aiw{color:var(--am);font-family:var(--mono)}.aip{color:var(--te)}
.aid{font-size:10px;color:var(--t3);margin-top:3px;line-height:1.5}
.aiadd{background:transparent;border:1px solid var(--b2);color:var(--t2);border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer;margin-top:5px}
.aiadd:hover{border-color:var(--te2);color:var(--te)}
.loading{display:inline-flex;gap:3px;align-items:center}
.loading span{width:4px;height:4px;border-radius:50%;background:var(--am);animation:d .9s infinite}
.loading span:nth-child(2){animation-delay:.2s}.loading span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.mo{background:var(--s1);border:1px solid var(--b2);border-radius:var(--r2);padding:18px;width:540px;max-width:100%;max-height:85vh;overflow-y:auto}
.mo h3{font-family:var(--mono);font-size:12px;color:var(--am);margin-bottom:12px}
.mo input,.mo select{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-size:12px;padding:6px 9px;font-family:var(--sans)}
.mo-btns{display:flex;gap:6px;margin-top:10px}
.mo-btns button{flex:1;padding:7px;border-radius:var(--r);font-family:var(--mono);font-size:10px;cursor:pointer}
.mo-cancel{background:transparent;border:1px solid var(--b1);color:var(--t2)}
.mo-ok{background:var(--am3);border:1px solid var(--am2);color:var(--am)}.mo-ok:hover{background:var(--am2);color:#fff}
.catcatalog{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:5px;max-height:340px;overflow-y:auto;padding-right:4px}
.catitem{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px;cursor:pointer;transition:all .12s;display:flex;justify-content:space-between;align-items:center}
.catitem:hover{border-color:var(--te2);background:rgba(45,212,191,.05)}
.catitem .cin{font-size:12px;font-weight:500}.catitem .cim{display:flex;gap:8px;font-size:10px;color:var(--t3)}
.catitem .ciw{color:var(--am);font-family:var(--mono)}
.rm-phase{display:grid;grid-template-columns:72px 1fr;gap:8px;margin-bottom:12px;align-items:start}
.rm-num{text-align:right;padding-top:4px}
.rm-num strong{display:block;font-family:var(--mono);font-size:20px;color:var(--am);line-height:1}
.rm-num small{font-family:var(--mono);font-size:9px;color:var(--t3);text-transform:uppercase}
.rm-body{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:10px 12px}
.rm-title{font-family:var(--mono);font-size:11px;margin-bottom:6px;color:var(--t1)}
.rtbadge{font-size:8px;padding:1px 5px;border-radius:2px;margin-left:5px;vertical-align:middle;font-family:var(--mono)}
.bfree{background:rgba(74,222,128,.1);color:var(--gr);border:1px solid #1a5c2e}
.bpaid{background:rgba(240,160,48,.08);color:var(--am);border:1px solid var(--am3)}
.rm-tasks{list-style:none;display:flex;flex-direction:column;gap:3px}
.rm-tasks li{font-size:11px;color:var(--t2);display:flex;gap:5px;align-items:baseline}
.rm-tasks li::before{content:'→';color:var(--am3);flex-shrink:0;font-family:var(--mono)}
.rm-tasks li code{background:var(--s3);border:1px solid var(--b1);border-radius:2px;padding:0 4px;font-size:10px;color:var(--te);font-family:var(--mono)}
.rm-tasks li strong{color:var(--am);font-weight:500}
.stacks{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.stk{background:var(--s2);border:1px solid var(--b1);border-radius:3px;padding:2px 7px;font-size:10px;font-family:var(--mono);color:var(--t2)}
.stk.hot{border-color:var(--am3);color:var(--am)}.stk.free{border-color:var(--te3);color:var(--te)}
.api-warn{background:rgba(248,113,113,.07);border:1px solid #7f2929;border-radius:var(--r);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--t2)}
.api-warn strong{color:var(--rd)}
.arow.has-modes{grid-template-columns:28px 16px 1fr 24px;align-items:start}
.mode-btns{display:flex;flex-wrap:wrap;gap:3px;padding:2px 0}
.modebtn{background:var(--s3);border:1px solid var(--b1);border-radius:3px;color:var(--t2);font-size:10px;cursor:pointer;padding:3px 7px;display:flex;align-items:center;gap:4px;transition:all .1s;font-family:var(--sans)}
.modebtn:hover{border-color:var(--b2);color:var(--t1)}.modebtn.on{border-color:var(--am);background:rgba(240,160,48,.08);color:var(--am)}
.modew{font-family:var(--mono);font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
