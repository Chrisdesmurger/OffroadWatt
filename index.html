<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OffroadWatt — Electrical autonomy calculator</title>
<meta name="description" content="Calculate the electrical autonomy of your motorhome, caravan or van. Battery, solar panels, appliances — all in one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e0d;--s1:#141817;--s2:#1c201e;--s3:#232926;
  --b1:#2a3330;--b2:#3d4a46;
  --t1:#e6ede8;--t2:#8da89a;--t3:#5a7068;
  --am:#f0a030;--am2:#c47a18;--am3:#7a4c0e;
  --te:#2dd4bf;--te2:#0f9985;--te3:#054840;
  --so:#fbbf24;--so2:#d97706;--so3:#7c4500;
  --rd:#f87171;--gr:#4ade80;--pu:#a78bfa;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --r:6px;--r2:10px;
}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:14px}
/* ── Mobile sticky autonomy bar ─────────────────────── */
.mob-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:50;height:46px;align-items:center;padding:0 14px;gap:7px;background:rgba(20,24,23,.96);border-bottom:1px solid var(--b1);backdrop-filter:blur(12px);animation:mbfade .18s ease}
.mob-bar-val{font-family:var(--mono);font-size:16px;font-weight:700}
.mob-bar-unit{font-size:10px;color:var(--t3);margin-right:2px}
.mob-bar-sep{color:var(--b2);font-size:12px;margin:0 1px}
.mob-bar-pill{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--t2)}
.mob-bar-pill i{font-size:11px}
.mob-bar-warn{display:flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);border-radius:100px;padding:2px 7px;color:var(--rd)}
@keyframes mbfade{from{opacity:.45;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media(max-width:768px){.mob-bar{display:flex}.app{padding-top:58px}}
.hdr{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--b1);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--am)}.logo em{color:var(--t3);font-style:normal}
.sub{font-size:10px;color:var(--t3);margin-top:1px}
.vtypes{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.vt{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 9px;cursor:pointer;text-align:center;transition:all .12s;min-width:68px}
.vt.on{border-color:var(--am);background:rgba(240,160,48,.07)}
.vt i{display:block;font-size:17px;color:var(--t3);margin-bottom:2px}.vt.on i{color:var(--am)}
.vt span{font-size:9px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.5px}.vt.on span{color:var(--am)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--b1);margin-bottom:16px;overflow-x:auto}
.tab{padding:7px 14px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tab.on{color:var(--am);border-bottom-color:var(--am)}.tab:hover:not(.on){color:var(--t2)}
.tab i{font-size:12px}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:660px){.col2{grid-template-columns:1fr}}
.col3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:1000px){.col3{grid-template-columns:1fr 1fr}}
@media(max-width:660px){.col3{grid-template-columns:1fr}}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:13px}
.ct{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.ct i{font-size:13px;color:var(--am)}.ct.sol i{color:var(--so)}.ct.te i{color:var(--te)}.ct.alt i{color:var(--pu)}.ct.alt{display:flex;align-items:center}
.catf{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cf{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:3px 9px;font-size:10px;font-family:var(--mono);color:var(--t3);cursor:pointer;transition:all .1s;text-transform:uppercase;letter-spacing:.4px}
.cf.on{border-color:var(--am);color:var(--am);background:rgba(240,160,48,.07)}
.cf:hover:not(.on){border-color:var(--b2);color:var(--t2)}
.applist{display:flex;flex-direction:column;gap:4px}
.arow{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:7px 10px;display:grid;grid-template-columns:28px 16px 1fr 70px 90px 52px 24px;align-items:center;gap:7px;transition:border-color .12s}
.arow:hover{border-color:var(--b2)}.arow.off{opacity:.35}
.arow .ai{font-size:13px;color:var(--t3)}
.arow .an{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .wf,.arow .hf{display:flex;align-items:center;gap:3px}
.arow .wf input,.arow .hf input{width:46px;background:var(--s3);border:1px solid var(--b1);border-radius:3px;color:var(--t1);font-family:var(--mono);font-size:11px;padding:2px 5px;text-align:center}
.arow .wf span,.arow .hf span{font-size:10px;color:var(--t3)}
.arow .wh{font-family:var(--mono);font-size:11px;color:var(--am);text-align:right;min-width:46px}
.arow.off .wh{color:var(--t3)}
.tog{width:26px;height:15px;border-radius:7px;background:var(--b1);cursor:pointer;border:none;position:relative;transition:background .12s;flex-shrink:0}
.tog.on{background:var(--te2)}.tog::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--t3);transition:all .12s}.tog.on::after{left:13px;background:#fff}
.delbtn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:2px;line-height:1;display:flex;align-items:center;justify-content:center}.delbtn:hover{color:var(--rd)}
.addbtn{background:transparent;border:1px dashed var(--b2);border-radius:var(--r);padding:7px;color:var(--t3);font-size:12px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .12s;margin-top:6px;font-family:var(--sans)}
.addbtn:hover{border-color:var(--am2);color:var(--am)}
.cons-footer{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cf-num{font-family:var(--mono);font-size:15px;color:var(--am);font-weight:700}
.bat-types{display:flex;gap:5px;margin-bottom:8px}
.btf{flex:1;text-align:center;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:5px 8px;font-size:11px;font-family:var(--mono);color:var(--t3);cursor:pointer;transition:all .12s;text-transform:uppercase;letter-spacing:.4px}
.btf:hover{border-color:var(--am2)}.btf.on{border-color:var(--am);color:var(--am);background:rgba(240,160,48,.07);font-weight:700}
.batgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:4px}
.bopt{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 4px;text-align:center;cursor:pointer;transition:all .12s}
.bopt:hover{border-color:var(--am2)}.bopt.on{border-color:var(--am);background:rgba(240,160,48,.07)}
.bopt .bah{font-family:var(--mono);font-size:12px;font-weight:700}.bopt.on .bah{color:var(--am)}
.bopt .btype{font-size:9px;color:var(--t3)}.bopt.on .btype{color:var(--am2)}
.dod-row,.nb-row{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.dod-row label,.nb-row label{font-size:11px;color:var(--t2);flex-shrink:0;min-width:110px}
.dod-row input[type=range]{flex:1;accent-color:var(--am);min-width:80px}
.dod-row .dv{font-family:var(--mono);font-size:12px;color:var(--am);min-width:28px}
.nb-btns{display:flex;gap:3px;flex-wrap:wrap}
.nbb{width:28px;height:24px;background:var(--s2);border:1px solid var(--b1);border-radius:3px;font-family:var(--mono);font-size:11px;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.nbb:hover{border-color:var(--am2);color:var(--am)}.nbb.on{border-color:var(--am);color:var(--am);background:rgba(240,160,48,.07);font-weight:700}
.bat-summary{background:var(--s3);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px;margin-top:8px;font-size:11px}
.bsrow{display:flex;justify-content:space-between;padding:2px 0;flex-wrap:wrap;gap:4px}
.bsn{color:var(--t2)}.bsv{font-family:var(--mono)}.bsv.hi{color:var(--te)}.bsv.am{color:var(--am)}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px;margin-bottom:8px}
.spo{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:5px 3px;text-align:center;cursor:pointer;transition:all .12s}
.spo:hover{border-color:var(--so2)}.spo.on{border-color:var(--so);background:rgba(251,191,36,.07)}
.spo .spw{font-family:var(--mono);font-size:12px;font-weight:700}.spo.on .spw{color:var(--so)}
.spo .spl{font-size:9px;color:var(--t3)}.spo.on .spl{color:var(--so2)}
.sol-config{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.scf{margin-bottom:6px}.scf label{font-size:11px;color:var(--t2);display:block;margin-bottom:3px}
.scf input,.scf select{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-family:var(--mono);font-size:11px;padding:5px 7px}
.scf select:focus,.scf input:focus{outline:none;border-color:var(--so2)}
.sol-summary{background:rgba(251,191,36,.06);border:1px solid var(--so3);border-radius:var(--r);padding:8px 10px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.ss-item .ssn{font-family:var(--mono);font-size:15px;color:var(--so);font-weight:700}
.ss-item .ssl{font-size:10px;color:var(--t3)}
.energy-panel{display:flex;flex-direction:column;gap:10px}
.ef-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:2px}
.ef-grid-4{grid-template-columns:repeat(4,1fr)}
.ef{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px;text-align:center}
.ef.sol{border-color:var(--so3)}.ef.bat{border-color:var(--te3)}.ef.net.ok{border-color:var(--te3)}.ef.net.bad{border-color:#7f2929}.ef.alt{border-color:#4c3680}
.ef .en{font-family:var(--mono);font-size:17px;font-weight:700}
.ef.sol .en{color:var(--so)}.ef.bat .en{color:var(--te)}.ef.net.ok .en{color:var(--gr)}.ef.net.bad .en{color:var(--rd)}.ef.alt .en{color:var(--pu)}
.ef .el{font-size:10px;color:var(--t3);margin-top:1px}
.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab-item .abn{font-size:10px;color:var(--t3);margin-bottom:2px}
.ab-item .abv{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
.ab-item .abu{font-size:10px;color:var(--t3);margin-top:1px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;border-radius:3px;font-family:var(--mono);margin-top:4px}
.tok{background:rgba(45,212,191,.1);color:var(--te);border:1px solid var(--te3)}
.twarn{background:rgba(248,113,113,.1);color:var(--rd);border:1px solid #7f2929}
.tsol{background:rgba(251,191,36,.1);color:var(--so);border:1px solid var(--so3)}
.tinf{background:rgba(167,139,250,.1);color:var(--pu);border:1px solid #4c3680}
.bkdown{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px}
.bkrow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--b1);font-size:11px}
.bkrow:last-child{border:none;padding-top:5px}
.bkn{color:var(--t2)}.bkv{font-family:var(--mono)}
.rec-list{display:flex;flex-direction:column;gap:4px}
.ritem{display:flex;justify-content:space-between;align-items:center;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 10px;flex-wrap:wrap;gap:4px}
.ritem.best{border-color:var(--te2)}
.ri-c{font-family:var(--mono);font-size:13px;font-weight:700}.ri-s{font-size:10px;color:var(--t3)}
.ri-d{font-family:var(--mono);font-size:12px;color:var(--te);text-align:right}.ri-n{font-size:9px;color:var(--t3)}
.btag{font-size:8px;background:rgba(45,212,191,.12);color:var(--te);border:1px solid var(--te3);padding:1px 4px;border-radius:2px;font-family:var(--mono);margin-left:4px}
.ai-row{display:flex;gap:6px;margin-bottom:6px}
.ai-in{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-size:13px;padding:8px 10px}
.ai-in:focus{outline:none;border-color:var(--am2)}
.aibtn{background:var(--am3);border:1px solid var(--am2);color:var(--am);border-radius:var(--r);padding:7px 12px;font-family:var(--mono);font-size:10px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.aibtn:hover:not(:disabled){background:var(--am2);color:#fff}.aibtn:disabled{opacity:.5;cursor:not-allowed}
.ai-item{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:9px 11px;margin-bottom:5px}
.ain{font-size:12px;font-weight:500}
.aimeta{display:flex;gap:10px;font-size:10px;color:var(--t2);flex-wrap:wrap;margin-top:3px}
.aiw{color:var(--am);font-family:var(--mono)}.aip{color:var(--te)}
.aid{font-size:10px;color:var(--t3);margin-top:3px;line-height:1.5}
.aiadd{background:transparent;border:1px solid var(--b2);color:var(--t2);border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer;margin-top:5px}
.aiadd:hover{border-color:var(--te2);color:var(--te)}
.loading{display:inline-flex;gap:3px;align-items:center}
.loading span{width:4px;height:4px;border-radius:50%;background:var(--am);animation:d .9s infinite}
.loading span:nth-child(2){animation-delay:.2s}.loading span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.mo{background:var(--s1);border:1px solid var(--b2);border-radius:var(--r2);padding:18px;width:540px;max-width:100%;max-height:85vh;overflow-y:auto}
.mo h3{font-family:var(--mono);font-size:12px;color:var(--am);margin-bottom:12px}
.mo input,.mo select{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-size:12px;padding:6px 9px;font-family:var(--sans)}
.mo-btns{display:flex;gap:6px;margin-top:10px}
.mo-btns button{flex:1;padding:7px;border-radius:var(--r);font-family:var(--mono);font-size:10px;cursor:pointer}
.mo-cancel{background:transparent;border:1px solid var(--b1);color:var(--t2)}
.mo-ok{background:var(--am3);border:1px solid var(--am2);color:var(--am)}.mo-ok:hover{background:var(--am2);color:#fff}
.catcatalog{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:5px;max-height:340px;overflow-y:auto;padding-right:4px}
.catitem{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px;cursor:pointer;transition:all .12s;display:flex;justify-content:space-between;align-items:center}
.catitem:hover{border-color:var(--te2);background:rgba(45,212,191,.05)}
.catitem .cin{font-size:12px;font-weight:500}.catitem .cim{display:flex;gap:8px;font-size:10px;color:var(--t3)}
.catitem .ciw{color:var(--am);font-family:var(--mono)}
.catitem-ai{border-color:var(--te3)}.catitem-ai:hover{border-color:var(--te2);background:rgba(45,212,191,.05)}
.catgrid-sep{padding:5px 2px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--te);opacity:.7}
.rm-phase{display:grid;grid-template-columns:72px 1fr;gap:8px;margin-bottom:12px;align-items:start}
.rm-num{text-align:right;padding-top:4px}
.rm-num strong{display:block;font-family:var(--mono);font-size:20px;color:var(--am);line-height:1}
.rm-num small{font-family:var(--mono);font-size:9px;color:var(--t3);text-transform:uppercase}
.rm-body{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:10px 12px}
.rm-title{font-family:var(--mono);font-size:11px;margin-bottom:6px;color:var(--t1)}
.rtbadge{font-size:8px;padding:1px 5px;border-radius:2px;margin-left:5px;vertical-align:middle;font-family:var(--mono)}
.bfree{background:rgba(74,222,128,.1);color:var(--gr);border:1px solid #1a5c2e}
.bpaid{background:rgba(240,160,48,.08);color:var(--am);border:1px solid var(--am3)}
.rm-tasks{list-style:none;display:flex;flex-direction:column;gap:3px}
.rm-tasks li{font-size:11px;color:var(--t2);display:flex;gap:5px;align-items:baseline}
.rm-tasks li::before{content:'→';color:var(--am3);flex-shrink:0;font-family:var(--mono)}
.rm-tasks li code{background:var(--s3);border:1px solid var(--b1);border-radius:2px;padding:0 4px;font-size:10px;color:var(--te);font-family:var(--mono)}
.rm-tasks li strong{color:var(--am);font-weight:500}
.stacks{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.stk{background:var(--s2);border:1px solid var(--b1);border-radius:3px;padding:2px 7px;font-size:10px;font-family:var(--mono);color:var(--t2)}
.stk.hot{border-color:var(--am3);color:var(--am)}.stk.free{border-color:var(--te3);color:var(--te)}
.api-warn{background:rgba(248,113,113,.07);border:1px solid #7f2929;border-radius:var(--r);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--t2)}
.api-warn strong{color:var(--rd)}
.cat-badge{font-size:9px;font-family:var(--mono);background:rgba(45,212,191,.08);border:1px solid var(--te3);color:var(--te);padding:1px 6px;border-radius:3px;margin-left:auto;display:flex;align-items:center;gap:3px}
.ai-section-hd{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin:10px 0 5px;display:flex;align-items:center;gap:5px}
.src-badge{font-size:9px;font-family:var(--mono);padding:1px 5px;border-radius:2px;margin-left:4px;vertical-align:middle;display:inline-flex;align-items:center;gap:3px}
.src-badge.catalog{background:rgba(45,212,191,.07);border:1px solid var(--te3);color:var(--te)}
.src-badge.online{background:rgba(251,191,36,.07);border:1px solid var(--so3);color:var(--so)}
.arow.has-modes{grid-template-columns:28px 16px 1fr auto 52px 24px;grid-template-rows:auto auto;row-gap:5px;align-items:center}
.arow.has-modes .mode-btns{grid-column:2 / -2;grid-row:2;display:flex;flex-wrap:wrap;gap:3px}
.arow.two-row{grid-template-columns:28px 16px 1fr auto 24px;grid-template-rows:auto auto;row-gap:6px;align-items:center}
.arow.two-row .an{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
.arow.two-row .row-inputs{grid-column:2 / -1;grid-row:2;display:flex;gap:10px}
.appgroup{margin-bottom:10px}
.appgroup-hd{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 5px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)}
.appgroup-hd .appgroup-wh{color:var(--am)}
.appgroup .arow{margin-bottom:5px}
.arow.two-row{grid-template-columns:28px 16px 1fr auto 24px;grid-template-rows:auto auto;row-gap:6px;align-items:center}
.arow.two-row .an{white-space:normal;overflow:visible;text-overflow:clip}
.arow.two-row .row-inputs{grid-column:2 / -1;grid-row:2;display:flex;gap:10px}
.modebtn{background:var(--s3);border:1px solid var(--b1);border-radius:3px;cursor:pointer;padding:3px 8px;display:flex;align-items:center;gap:5px;transition:all .1s}
.modebtn:hover{border-color:var(--b2)}.modebtn.on{border-color:var(--am);background:rgba(240,160,48,.08)}
.modew{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--am)}.modebtn.on .modew{color:var(--am)}
.model{font-size:10px;color:var(--t3)}.modebtn.on .model{color:var(--t2)}

/* ── Auth button ── */
.lang-switch{display:inline-flex;gap:2px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:2px}
.lang-opt{background:none;border:none;color:var(--t3);font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 7px;border-radius:4px;cursor:pointer;transition:all .12s}
.lang-opt:hover{color:var(--am)}.lang-opt.on{background:var(--am);color:#1a1206}
.auth-btn{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 10px;color:var(--t2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.auth-btn:hover{border-color:var(--am2);color:var(--am)}.auth-btn.on{border-color:var(--te2);color:var(--te);background:rgba(45,212,191,.06)}
@media(max-width:480px){.auth-lbl{display:none}}
.pro-badge{background:rgba(167,139,250,.15);border:1px solid #4c3680;color:var(--pu);font-size:8px;padding:1px 5px;border-radius:2px;font-family:var(--mono)}
.plan-pill{font-size:9px;font-family:var(--mono);padding:2px 6px;border-radius:3px}.plan-pill.free{background:var(--s3);color:var(--t3);border:1px solid var(--b1)}.plan-pill.pro{background:rgba(167,139,250,.12);color:var(--pu);border:1px solid #4c3680}

/* ── Auth modal ── */
.google-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-size:12px;cursor:pointer;transition:all .15s;margin-bottom:10px}
.google-btn:hover{border-color:var(--b2);background:var(--s3)}
.auth-divider{text-align:center;position:relative;margin:10px 0;color:var(--t3);font-size:10px}
.auth-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--b1)}
.auth-divider span{position:relative;background:var(--s1);padding:0 8px}

/* ── Configs modal ── */
.config-item{display:flex;justify-content:space-between;align-items:center;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 10px;margin-bottom:5px;gap:8px}
.ci-name{font-size:12px;font-weight:500;color:var(--t1)}.ci-date{font-size:10px;color:var(--t3);margin-top:1px}

/* ── Save config button ── */
.save-cfg-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;background:rgba(45,212,191,.05);border:1px solid var(--te3);border-radius:var(--r);color:var(--te);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.8px;cursor:pointer;transition:all .15s;margin-top:2px}
.save-cfg-btn:hover{background:rgba(45,212,191,.1);border-color:var(--te2)}.save-count{background:var(--te3);color:var(--te);font-size:9px;padding:1px 5px;border-radius:2px;margin-left:2px}

/* ── AI quota ── */
.ai-quota{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:6px 10px;margin-bottom:8px}
.ai-quota.depleted{color:var(--am);border-color:var(--am3);background:rgba(240,160,48,.05)}
.quota-cta{background:none;border:none;color:var(--am);text-decoration:underline;cursor:pointer;font-size:11px;padding:0}

/* ── Save / PDF buttons ── */
.pdf-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;background:transparent;border:1px solid var(--b2);border-radius:var(--r);color:var(--t2);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.8px;cursor:pointer;transition:all .15s;margin-top:4px}
.pdf-btn:hover{border-color:var(--am2);color:var(--am);background:rgba(240,160,48,.05)}
.pdf-btn i{font-size:14px}
.print-report{display:none}

/* ── Capture comparateur (dashboard) ── */
.capture-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px solid var(--b1)}
.capture-lbl{font-size:10px;color:var(--t3);font-family:var(--mono);display:flex;align-items:center;gap:4px;margin-right:auto}
.capture-btn{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t2);font-family:var(--mono);font-size:10px;padding:5px 10px;cursor:pointer;transition:all .15s}
.capture-btn:hover{border-color:var(--pu);color:var(--pu)}
.capture-btn.filled{border-color:var(--pu);color:var(--pu);background:rgba(167,139,250,.07)}

/* ── Compare tab ── */
.cmp-slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:600px){.cmp-slots{grid-template-columns:1fr}}
.cmp-slot{border:1px solid var(--b1);border-radius:var(--r);padding:10px 12px;background:var(--s2)}
.cmp-slot.filled{border-color:var(--pu)}.cmp-slot.empty{border-style:dashed}
.cmp-slot-hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;margin-bottom:4px}
.cmp-tag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--pu);color:#1a1330;font-family:var(--mono);font-size:11px;font-weight:700}
.cmp-tag.empty{background:var(--b1);color:var(--t3)}
.cmp-clear{margin-left:auto;background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;display:flex;padding:2px}.cmp-clear:hover{color:var(--rd)}
.cmp-slot-sum{font-size:11px;color:var(--t3);font-family:var(--mono)}
.cmp-empty{text-align:center;padding:28px 16px}
.cmp-table{width:100%;border-collapse:collapse;font-size:12px}
.cmp-table th{text-align:right;padding:6px 8px;font-size:10px;color:var(--t3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--b1)}
.cmp-table th:first-child{text-align:left}
.cmp-table th .cmp-tag{margin-right:3px}
.cmp-table td{padding:6px 8px;border-bottom:1px solid var(--b1)}
.cmp-lbl{color:var(--t2)}
.cmp-val{text-align:right;font-family:var(--mono);color:var(--t1)}
.cmp-d{text-align:right;width:80px}
.cmp-delta{font-family:var(--mono);font-size:11px;color:var(--t3)}
.cmp-delta.up{color:var(--gr)}.cmp-delta.down{color:var(--rd)}
.cmp-cost td{color:var(--t2)}.cmp-cost tr:last-child td{font-weight:700;color:var(--t1)}
.cmp-cost tr:first-child td{border-top:2px solid var(--b2)}
.cmp-winner{display:flex;align-items:center;gap:6px;background:rgba(167,139,250,.07);border:1px solid #4c3680;border-radius:var(--r);padding:8px 12px;margin-top:10px;font-size:12px;color:var(--pu)}
.cmp-winner i{font-size:15px}
.roi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:600px){.roi-grid{grid-template-columns:1fr 1fr}}
.roi-item{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:10px;text-align:center}
.roi-v{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--t1)}
.roi-l{font-size:10px;color:var(--t3);margin-top:2px}
.roi-param{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t2);flex-wrap:wrap}
.roi-param input{width:60px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-family:var(--mono);font-size:11px;padding:4px 7px}

@media print {
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff!important;color:#1a1a1a!important;font-family:'DM Sans',Arial,sans-serif;font-size:10pt;line-height:1.55}
  .app>*:not(.print-report){display:none!important}
  .print-report{display:block!important;padding:0;max-width:100%}

  /* Header */
  .pr-header{display:flex;align-items:center;gap:16pt;margin-bottom:20pt;padding-bottom:12pt;border-bottom:2.5px solid #1a1a1a}
  .pr-logo{font-family:'Space Mono',monospace;font-size:20pt;font-weight:700;color:#c47a18;line-height:1;flex-shrink:0}
  .pr-logo::after{content:'';display:block;width:100%;height:3pt;background:#c47a18;margin-top:2pt;border-radius:2pt}
  .pr-meta{flex:1}
  .pr-title{font-size:13pt;font-weight:700;color:#1a1a1a;margin-bottom:2pt}
  .pr-date{font-size:8.5pt;color:#666}

  /* Summary box */
  .pr-summary{background:#f7f7f5;border:1px solid #e0e0de;border-radius:6pt;padding:10pt 14pt;margin-bottom:18pt;display:grid;grid-template-columns:repeat(4,1fr);gap:10pt}
  .pr-sum-item{text-align:center}
  .pr-sum-v{font-family:'Space Mono',monospace;font-size:14pt;font-weight:700;color:#1a1a1a;display:block}
  .pr-sum-l{font-size:7.5pt;color:#666;text-transform:uppercase;letter-spacing:.5pt}

  /* Sections */
  .pr-section{margin-bottom:16pt;page-break-inside:avoid}
  .pr-sh{font-family:'Space Mono',monospace;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:1.5pt;color:#888;border-bottom:1px solid #ddd;margin-bottom:7pt;padding-bottom:3pt}

  /* Tables */
  .pr-table{width:100%;border-collapse:collapse;font-size:9pt}
  .pr-table th{text-align:left;background:#f3f3f1;border-bottom:1.5px solid #ccc;padding:4pt 6pt;font-size:8pt;color:#444;font-weight:600;text-transform:uppercase;letter-spacing:.3pt}
  .pr-table th.num,.pr-table td.num{text-align:right;font-family:'Space Mono',monospace}
  .pr-table td{padding:4pt 6pt;border-bottom:1px solid #ececea}
  .pr-table tr:last-child td{border-bottom:none}
  .pr-table tr.off td{color:#aaa}
  .pr-table tr.pr-total td{font-weight:700;background:#f9f9f7;border-top:1.5px solid #ccc;border-bottom:none;padding-top:5pt;font-family:'Space Mono',monospace;font-size:9.5pt}

  /* 3-col grid for bat/solar/alt cards */
  .pr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10pt;margin-bottom:16pt}
  .pr-card{border:1px solid #e0e0de;border-radius:5pt;padding:8pt 10pt}
  .pr-card-title{font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.5pt;color:#888;margin-bottom:5pt}

  /* KV rows */
  .pr-kv{width:100%;border-collapse:collapse;font-size:9pt}
  .pr-kv td{padding:3.5pt 0;border-bottom:1px solid #ececea}
  .pr-kv tr:last-child td{border-bottom:none}
  .pr-kv td:first-child{color:#555;padding-right:8pt}
  .pr-kv td:last-child{font-family:'Space Mono',monospace;font-weight:600;text-align:right}
  .pr-kv tr.pr-hi td:last-child{color:#c47a18}
  .pr-kv tr.pr-ok td:last-child{color:#0f9985}
  .pr-kv tr.pr-danger td:last-child{color:#dc2626}

  /* Footer */
  .pr-footer{margin-top:20pt;padding-top:8pt;border-top:1px solid #ddd;font-size:7.5pt;color:#aaa;text-align:center;letter-spacing:.3pt}

  @page{margin:1.8cm 1.5cm;size:A4 portrait}
}
</style>
