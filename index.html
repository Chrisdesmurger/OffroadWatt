const sunH=()=>S.sunIdx===SUN_ZONES.length-1?(parseFloat(S.customSunH)||4.5):SUN_ZONES[S.sunIdx].h;
function calc(){
  const active=S.apps.filter(a=>a.on);
  const cons=active.reduce((s,a)=>s+(a.w*a.h),0);
  const solar=S.solW*S.solNb*sunH()*S.solEff;
  const net=Math.max(0,cons-solar);
  const batWhUnit=S.bat.ah*S.bat.v;
  const batWhTotal=batWhUnit*S.batNb;
  const usable=batWhTotal*S.dod;
  const autDays=net>0?usable/net:Infinity;
  const solCovPct=cons>0?Math.min(100,solar/cons*100):100;
  return{cons,solar,net,batWhUnit,batWhTotal,usable,autDays,solCovPct,breakdown:active.map(a=>({...a,wh:Math.round(a.w*a.h)}))};
}

}

function buildModal(){
  const m=S.modal;
  if(m.type==='catalog'){
    const cf=m.catFilter||'Cuisine';
    const filtered=CATALOG.filter(c=>c.cat===cf);
    return`<div class="ov" onclick="if(event.target===this)set({modal:null})"><div class="mo">
      <h3><i class="ti ti-book"></i> Catalogue d'appareils</h3>
      <div class="catcatalog">${['Cuisine','Confort','Tech','Eau','Éclairage','Système'].map(c=>`<div class="cf${cf===c?' on':''}" onclick="set({modal:{...S.modal,catFilter:'${c}'}})">${c}</div>`).join('')}</div>
      <div class="catgrid">${filtered.map(item=>`<div class="catitem" onclick="addFromCatalog(${CATALOG.indexOf(item)})">
        <div><div class="cin">${item.n}</div><div class="cim"><span class="ciw">${item.w}W</span><span>${item.h}h/j</span></div></div>
        <i class="ti ti-plus" style="font-size:14px;color:var(--t3)"></i></div>`).join('')}
      </div>
      <div class="mo-btns"><button class="mo-cancel" onclick="set({modal:null})">Fermer</button></div>
    </div></div>`;
  }
  return`<div class="ov" onclick="if(event.target===this)set({modal:null})"><div class="mo">
    <h3><i class="ti ti-plus"></i> Appareil personnalisé</h3>
    <input id="mn" type="text" placeholder="Nom de l'appareil" style="width:100%;margin-bottom:7px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:7px">
      <div><label style="font-size:11px;color:var(--t2);display:block;margin-bottom:3px">Watts</label><input id="mw" type="number" placeholder="W" min="0" max="5000" style="width:100%"></div>
      <div><label style="font-size:11px;color:var(--t2);display:block;margin-bottom:3px">Heures/jour</label><input id="mh" type="number" placeholder="h" min="0" max="24" step="0.5" value="4" style="width:100%"></div>
      <div><label style="font-size:11px;color:var(--t2);display:block;margin-bottom:3px">Catégorie</label><select id="mc" style="width:100%">${['Cuisine','Confort','Tech','Eau','Éclairage','Système'].map(c=>`<option>${c}</option>`).join('')}</select></div>

function bindEvents(){
  document.querySelectorAll('.fi').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const id=parseInt(e.target.dataset.id),field=e.target.dataset.field,val=parseFloat(e.target.value)||0;
      set({apps:S.apps.map(a=>a.id===id?{...a,[field]:val}:a)});
    });
  });
  const aiq=document.getElementById('aiq');
  if(aiq)aiq.addEventListener('input',e=>{S.aiQuery=e.target.value;});
}

window.set=set;
window.delApp=id=>set({apps:S.apps.filter(a=>a.id!==id)});
window.selectBat=i=>{const b=BATS[i];set({bat:b,dod:DOD[b.type]})};
window.setSunIdx=v=>set({sunIdx:parseInt(v)});
window.doSearch=()=>{const q=document.getElementById('aiq')?.value?.trim();if(q){S.aiQuery=q;searchAI(q);}};
window.addFromAI=i=>{
  const r=S.aiResults[i];
  const cats={réfrigérateur:'Cuisine',chauffage:'Confort',éclairage:'Éclairage',pompe:'Eau',tv:'Tech',laptop:'Tech',micro:'Cuisine'};
  const cat=Object.entries(cats).find(([k])=>r.type?.toLowerCase().includes(k))?.[1]||'Tech';
  const icons={Cuisine:'ti-bowl-spoon',Confort:'ti-temperature',Éclairage:'ti-bulb',Eau:'ti-droplet',Tech:'ti-cpu',Système:'ti-plug'};
  set({apps:[...S.apps,{id:Date.now(),n:r.name+(r.brand?' ('+r.brand+')':''),icon:icons[cat]||'ti-plug',w:r.watts||0,h:4,on:true,cat}],tab:'apps'});
};
window.addFromCatalog=idx=>{
  const item=CATALOG[idx];
  set({apps:[...S.apps,{id:Date.now(),n:item.n,icon:item.icon,w:item.w,h:item.h,on:true,cat:item.cat}],modal:null,tab:'apps'});
};
window.confirmCustom=()=>{
  const n=document.getElementById('mn')?.value?.trim();
  const w=parseFloat(document.getElementById('mw')?.value)||0;
  const h=parseFloat(document.getElementById('mh')?.value)||0;
  const cat=document.getElementById('mc')?.value||'Tech';
  if(!n)return;
  const icons={Cuisine:'ti-bowl-spoon',Confort:'ti-armchair',Éclairage:'ti-bulb',Eau:'ti-droplet',Tech:'ti-cpu',Système:'ti-plug'};
  set({apps:[...S.apps,{id:Date.now(),n,icon:icons[cat]||'ti-plug',w,h,on:true,cat}],modal:null});
};

async function searchAI(q){
  if(!API_KEY||API_KEY.length<10)return;
  set({aiLoading:true,aiResults:[]});
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:`Expert équipements camping-car/van. Recherche: "${q}". Retourne UNIQUEMENT du JSON valide sans markdown:
{"results":[{"name":"Nom complet","brand":"Marque","watts":45,"voltage":12,"price_eur":299,"description":"1-2 phrases précises","type":"catégorie","efficiency":"A+++"}]}
3-4 produits réels marché européen avec consommation électrique précise en watts.`}]})
    });
    const d=await r.json();
    const t=d.content?.find(b=>b.type==='text');
    if(t){const j=JSON.parse(t.text.replace(/```json|```/g,'').trim());set({aiResults:j.results||[],aiLoading:false});}
    else set({aiLoading:false});
  }catch(e){set({aiLoading:false,aiResults:[{name:'Erreur',brand:'',watts:0,description:'Vérifiez la clé API et la connexion.',type:'',price_eur:0}]});}
}

render();
</script>
